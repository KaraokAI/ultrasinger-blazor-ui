# Python toolchain for UltraSinger.Processor.
#
# One venv holds everything the processor shells out to:
#   .venv/bin/python        -> runs ../UltraSinger/src/UltraSinger.py (git submodule)
#   .venv/bin/demucs        -> vocal separation for USDB downloads
#   .venv/bin/syncedlyrics  -> reference lyrics for the OpenAI pass
#   .venv/bin/yt-dlp        -> media downloads
#
# Set up with:  uv sync          (from this directory)
[project]
name = "ultrasinger-processor-tools"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # UltraSinger's own dependency list (whisperx, demucs, yt-dlp, torch, ...). Installed
    # from the submodule so its requirements stay the single source of truth; the script
    # itself is run by path, not imported as a package.
    "ultrasinger",
    "syncedlyrics",
    # Declared directly (versions match UltraSinger's pins) so the cu128 index below applies;
    # uv sources only affect direct dependencies.
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
]

[tool.uv]
# Only ever runs on Linux (natively or in the container); skips resolving for other platforms.
environments = ["sys_platform == 'linux'"]
